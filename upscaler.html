<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Upscaler by Md Rasad Mahmud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans text-gray-800">

    <!-- Header Section -->
    <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center border-b border-gray-200">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-wand-magic-sparkles text-blue-600 text-2xl"></i>
            <h1 class="text-2xl font-bold text-gray-800">Pro<span class="text-blue-600">Upscaler</span></h1>
        </div>
        <span class="bg-blue-100 text-blue-800 py-1.5 px-4 rounded-full text-sm font-bold tracking-wide shadow-sm border border-blue-200">
            Md Rasad Mahmud
        </span>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-6 mt-6">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
            <h2 class="text-xl font-semibold mb-6 text-gray-700 flex items-center gap-2">
                <i class="fa-solid fa-cloud-arrow-up text-blue-500"></i> Upload Image or Video for AI Upscaling
            </h2>

            <!-- Upload Box -->
            <div id="drop-zone" class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center bg-gray-50 hover:bg-gray-100 transition cursor-pointer relative">
                <input type="file" id="file-input" class="absolute inset-0 opacity-0 cursor-pointer" accept="image/*,video/*">
                <i class="fa-solid fa-file-arrow-up text-4xl text-blue-500 mb-3"></i>
                <p class="text-gray-600 font-medium">Drag & drop your file here, or <span class="text-blue-600 underline">Browse</span></p>
                <p class="text-gray-400 text-sm mt-1">Supports PNG, JPG, MP4, MOV</p>
            </div>

            <!-- Preview Section (Hidden initially) -->
            <div id="preview-container" class="hidden mt-6 text-center">
                <h3 class="text-sm font-semibold text-gray-500 mb-2">Selected File Preview:</h3>
                <div id="media-preview" class="max-h-64 mx-auto rounded-lg overflow-hidden border border-gray-200 shadow-sm inline-block"></div>
                
                <!-- Action Buttons: Clear & Upscale -->
                <div class="flex justify-center gap-4 mt-4">
                    <button id="clear-btn" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-6 rounded-lg transition shadow-md flex items-center gap-2">
                        <i class="fa-solid fa-trash-can"></i> Clear File
                    </button>
                    <button id="upscale-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-8 rounded-lg transition shadow-lg flex items-center gap-2">
                        <i class="fa-solid fa-bolt"></i> Start Upscaling (4K/16K)
                    </button>
                </div>
            </div>

            <!-- Result Section (Hidden initially) -->
            <div id="result-container" class="hidden mt-8 text-center border-t pt-6">
                <h3 class="text-lg font-bold text-gray-700 mb-3"><i class="fa-solid fa-circle-check text-green-500"></i> Upscaling Successful!</h3>
                <div id="result-preview" class="max-h-72 mx-auto rounded-lg overflow-hidden border border-gray-200 shadow-md inline-block mb-4"></div>
                <div>
                    <a id="download-btn" href="#" download="upscaled-output.png" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-xl transition shadow-lg inline-flex items-center gap-2">
                        <i class="fa-solid fa-download"></i> Download Upscaled File
                    </a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white text-center py-4 border-t border-gray-200 text-gray-500 text-sm">
        &copy; 2026 Pro Upscaler. Developed with passion by <strong>Md Rasad Mahmud</strong>.
    </footer>

    <!-- JavaScript for Interactivity -->
    <script>
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const mediaPreview = document.getElementById('media-preview');
        const clearBtn = document.getElementById('clear-btn');
        const upscaleBtn = document.getElementById('upscale-btn');
        const resultContainer = document.getElementById('result-container');
        const resultPreview = document.getElementById('result-preview');
        const downloadBtn = document.getElementById('download-btn');

        let selectedFile = null;

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                mediaPreview.innerHTML = '';
                
                if (file.type.startsWith('image/')) {
                    const img = document.createElement('img');
                    img.src = URL.createObjectURL(file);
                    img.className = 'max-h-60 object-contain';
                    mediaPreview.appendChild(img);
                } else if (file.type.startsWith('video/')) {
                    const video = document.createElement('video');
                    video.src = URL.createObjectURL(file);
                    video.controls = true;
                    video.className = 'max-h-60 object-contain';
                    mediaPreview.appendChild(video);
                }

                previewContainer.classList.remove('hidden');
            }
        });

        // Clear button logic
        clearBtn.addEventListener('click', () => {
            fileInput.value = '';
            selectedFile = null;
            mediaPreview.innerHTML = '';
            previewContainer.classList.add('hidden');
            resultContainer.classList.add('hidden');
        });

        // Upscale button simulation/action trigger
        upscaleBtn.addEventListener('click', () => {
            if (!selectedFile) return;
            
            upscaleBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing AI...';
            upscaleBtn.disabled = true;

            setTimeout(() => {
                upscaleBtn.innerHTML = '<i class="fa-solid fa-bolt"></i> Start Upscaling (4K/16K)';
                upscaleBtn.disabled = false;
                
                // Show mock/result preview (In production, this connects to Replicate AI output)
                resultPreview.innerHTML = mediaPreview.innerHTML;
                downloadBtn.href = URL.createObjectURL(selectedFile);
                resultContainer.classList.remove('hidden');
                
                // Scroll to result
                resultContainer.scrollIntoView({ behavior: 'smooth' });
            }, 2500);
        });
    </script>
</body>
</html>
