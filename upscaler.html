<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Upscaler by Md Rasad Mahmud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans text-gray-800">

    <!-- Header Section -->
    <header class="bg-white shadow-sm py-4 px-8 flex justify-between items-center border-b border-gray-200">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-wand-magic-sparkles text-blue-600 text-2xl"></i>
            <h1 class="text-2xl font-bold text-gray-800">Pro<span class="text-blue-600">Upscaler</span></h1>
        </div>
        <span class="bg-blue-100 text-blue-800 py-1.5 px-4 rounded-full text-sm font-bold tracking-wide shadow-sm border border-blue-200">
            Developer By Md Rasad Mahmud
        </span>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col items-center justify-center p-6">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-2xl text-center border border-gray-100">
            
            <!-- Tabs for Image & Video -->
            <div class="flex justify-center mb-8 bg-gray-100 p-1 rounded-xl">
                <button id="tab-image" class="flex-1 py-3 px-6 rounded-lg font-bold text-blue-600 bg-white shadow-sm transition-all" onclick="switchTab('image')">
                    <i class="fa-regular fa-image mr-2"></i> Image Upscale
                </button>
                <button id="tab-video" class="flex-1 py-3 px-6 rounded-lg font-bold text-gray-500 hover:text-gray-700 transition-all" onclick="switchTab('video')">
                    <i class="fa-solid fa-video mr-2"></i> Video Upscale
                </button>
            </div>

            <h2 id="main-title" class="text-3xl font-extrabold mb-3 text-gray-900">Enhance Image Quality</h2>
            <p id="sub-title" class="text-gray-500 mb-8 font-medium">Upload your low-resolution file and select target resolution.</p>

            <!-- Upload Area -->
            <div id="drop-zone" class="border-4 border-dashed border-blue-200 rounded-2xl p-10 hover:border-blue-500 hover:bg-blue-50 transition-all cursor-pointer relative group">
                <input type="file" id="file-upload" class="hidden" accept="image/*, video/*">
                <div class="flex flex-col items-center pointer-events-none">
                    <i id="upload-icon" class="fa-solid fa-cloud-arrow-up text-5xl text-blue-400 mb-4 group-hover:text-blue-600 transition-colors"></i>
                    <span id="file-name" class="text-lg font-medium text-gray-600">
                        Drag & Drop your <span id="file-type-text">image</span> here, or <span class="text-blue-500 font-semibold">Browse</span>
                    </span>
                </div>
            </div>

            <!-- Resolution Selector -->
            <div class="mt-6 text-left">
                <label class="block text-sm font-bold text-gray-700 mb-3">Select Target Resolution:</label>
                <div class="flex gap-4">
                    <button id="res-4k" class="res-btn flex-1 py-3 border-2 border-blue-600 bg-blue-50 text-blue-700 font-bold rounded-xl transition-all shadow-sm" onclick="selectRes('4k')">4K UHD</button>
                    <button id="res-8k" class="res-btn flex-1 py-3 border-2 border-gray-200 text-gray-500 font-bold rounded-xl hover:border-blue-300 transition-all" onclick="selectRes('8k')">8K Cinema</button>
                    <button id="res-16k" class="res-btn flex-1 py-3 border-2 border-gray-200 text-gray-500 font-bold rounded-xl hover:border-blue-300 transition-all" onclick="selectRes('16k')">16K Ultra</button>
                </div>
            </div>

            <!-- Action Button -->
            <button id="upscale-btn" class="mt-8 w-full py-4 rounded-xl font-bold text-white text-lg bg-gray-300 cursor-not-allowed transition-all" disabled>
                Start Upscaling
            </button>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="bg-gray-900 text-gray-400 py-6 text-center text-sm">
        <p>&copy; 2026 Pro Upscaler. All rights reserved.</p>
        <p class="mt-2 text-base">Developed with <i class="fa-solid fa-heart text-red-500 mx-1"></i> by <span class="text-white font-bold tracking-wider">Md Rasad Mahmud</span></p>
    </footer>

    <!-- Interactive JavaScript -->
    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileUpload = document.getElementById('file-upload');
        const fileName = document.getElementById('file-name');
        const upscaleBtn = document.getElementById('upscale-btn');
        
        // Tab Elements
        const tabImage = document.getElementById('tab-image');
        const tabVideo = document.getElementById('tab-video');
        const mainTitle = document.getElementById('main-title');
        const uploadIcon = document.getElementById('upload-icon');

        let currentMode = 'image';
        let currentRes = '4k';

        // Handle Resolution Selection
        function selectRes(res) {
            currentRes = res;
            const buttons = {
                '4k': document.getElementById('res-4k'),
                '8k': document.getElementById('res-8k'),
                '16k': document.getElementById('res-16k')
            };

            for (let key in buttons) {
                buttons[key].className = 'res-btn flex-1 py-3 border-2 border-gray-200 text-gray-500 font-bold rounded-xl hover:border-blue-300 transition-all';
            }
            buttons[res].className = 'res-btn flex-1 py-3 border-2 border-blue-600 bg-blue-50 text-blue-700 font-bold rounded-xl transition-all shadow-sm';
        }

        // Handle Tab Switching
        function switchTab(mode) {
            currentMode = mode;
            fileName.innerHTML = `Drag & Drop your <span id="file-type-text">${mode}</span> here, or <span class="text-blue-500 font-semibold">Browse</span>`;
            upscaleBtn.disabled = true;
            upscaleBtn.className = 'mt-8 w-full py-4 rounded-xl font-bold text-white text-lg bg-gray-300 cursor-not-allowed transition-all';
            
            if (mode === 'image') {
                tabImage.className = 'flex-1 py-3 px-6 rounded-lg font-bold text-blue-600 bg-white shadow-sm transition-all';
                tabVideo.className = 'flex-1 py-3 px-6 rounded-lg font-bold text-gray-500 hover:text-gray-700 transition-all';
                mainTitle.innerText = 'Enhance Image Quality';
                uploadIcon.className = 'fa-regular fa-image text-5xl text-blue-400 mb-4 group-hover:text-blue-600 transition-colors';
                fileUpload.accept = 'image/*';
            } else {
                tabVideo.className = 'flex-1 py-3 px-6 rounded-lg font-bold text-blue-600 bg-white shadow-sm transition-all';
                tabImage.className = 'flex-1 py-3 px-6 rounded-lg font-bold text-gray-500 hover:text-gray-700 transition-all';
                mainTitle.innerText = 'Upgrade Video Quality';
                uploadIcon.className = 'fa-solid fa-film text-5xl text-blue-400 mb-4 group-hover:text-blue-600 transition-colors';
                fileUpload.accept = 'video/*';
            }
        }

        dropZone.addEventListener('click', () => fileUpload.click());

        fileUpload.addEventListener('change', function() {
            if(this.files && this.files[0]) {
                setFile(this.files[0].name);
            }
        });

        function setFile(name) {
            fileName.innerHTML = `<span class="text-green-600 font-bold"><i class="fa-solid fa-check-circle mr-2"></i> ${name}</span>`;
            upscaleBtn.disabled = false;
            upscaleBtn.className = 'mt-8 w-full py-4 rounded-xl font-bold text-white text-lg bg-blue-600 hover:bg-blue-700 shadow-lg hover:shadow-blue-500/50 transition-all';
        }
    </script>
</body>
</html>
